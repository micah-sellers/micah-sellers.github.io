<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Solar System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@200;300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden}
canvas{display:block;cursor:default}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const CW=10,CH=16;
const cvs=document.getElementById('c');
const ctx=cvs.getContext('2d');
let GW,GH;
function resize(){cvs.width=innerWidth;cvs.height=innerHeight;GW=Math.floor(cvs.width/CW);GH=Math.floor(cvs.height/CH);}
resize();addEventListener('resize',resize);

// --- vec3 ---
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const len2=a=>dot(a,a);
const len=a=>Math.sqrt(len2(a));
const norm=a=>{const l=len(a);return l<1e-9?[0,1,0]:mul(a,1/l);};
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const lerp=(a,b,t)=>a+(b-a)*t;
const lv=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const clamp=(x,lo,hi)=>Math.max(lo,Math.min(hi,x));

// --- hash ---
function hash32(x,y,s){
  let h=(Math.imul(x,374761393)^Math.imul(y,1376312589)^Math.imul(s,2654435761))>>>0;
  h=Math.imul(h^(h>>>13),1540483477)>>>0;
  return(h^(h>>>15))>>>0;
}
const fhash=(x,y,s)=>hash32(x,y,s)/0xFFFFFFFF;

// smooth trilinear noise
function sNoise(x,y,z){
  const ix=Math.floor(x),iy=Math.floor(y),iz=Math.floor(z);
  const fx=x-ix,fy=y-iy,fz=z-iz;
  const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy),uz=fz*fz*(3-2*fz);
  return lerp(lerp(lerp(fhash(ix,iy,iz),    fhash(ix+1,iy,iz),   ux),
                   lerp(fhash(ix,iy+1,iz),  fhash(ix+1,iy+1,iz), ux),uy),
              lerp(lerp(fhash(ix,iy,iz+1),  fhash(ix+1,iy,iz+1), ux),
                   lerp(fhash(ix,iy+1,iz+1),fhash(ix+1,iy+1,iz+1),ux),uy),uz);
}

const RAMP=' .`\'^"-~:;Il!i><+_?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$';

// --- scene bodies ---
const BODIES=[
  {id:0,name:'Sol',    pos:[0,0,0],   r:6.0,  orbitR:0,   col:[255,200,80],  cs:'*@#$%&8!+~',  sun:true,
   desc:['THE SUN','Our star','G-type main seq','1.4M km diameter','Surface 5500 C','Core 15 million C','Plasma and fusion']},
  {id:1,name:'Mercury',pos:[18,0,0],  r:0.30, orbitR:18,  col:[180,158,136], cs:'.-:;!|~',   spd:0.030,ph:0,
   desc:['MERCURY','Smallest planet','No atmosphere','Extreme temps','Iron core inside','Dense and hot','Cratered surface']},
  {id:2,name:'Venus',  pos:[30,0,0],  r:0.55, orbitR:30,  col:[230,200,140], cs:'oO0Q@&*',   spd:0.018,ph:1.0,
   desc:['VENUS','Hottest planet','Thick CO2 air','462C surface','Slow rotation','Retrograde spin','Sulfur clouds thick']},
  {id:3,name:'Earth',  pos:[42,0,0],  r:0.60, orbitR:42,  col:[80,150,220],  cs:'+x*=#~.',   spd:0.012,ph:2.0,
   desc:['EARTH','Our home world','Liquid oceans','Oxygen in air','Plate tectonics','One large moon','Life everywhere']},
  {id:4,name:'Mars',   pos:[57,0,0],  r:0.45, orbitR:57,  col:[210,90,70],   cs:'v^<>|/!',   spd:0.007,ph:3.8,
   desc:['MARS','The red planet','Thin CO2 air','Olympus Mons','Two small moons','Ancient riverbeds','Cold red desert']},
  {id:5,name:'Jupiter',pos:[114,0,0], r:1.90, orbitR:114, col:[200,175,140], cs:')(-=+~#',   spd:0.047,ph:5.0,
   desc:['JUPITER','Largest planet','Great Red Spot','95 known moons','Strong radiation','Fast 10hr day','Gas and ice core']},
  {id:6,name:'Saturn', pos:[180,0,0], r:1.50, orbitR:180, col:[210,190,150], cs:'O0oG@8Q',   spd:0.024,ph:1.5,
   hasRing:true,ringR1:1.90,ringR2:3.30,
   desc:['SATURN','Ringed wonder','Ice and rock rings','146 known moons','Hexagonal storm','Low density body','Gas giant twin']},
  {id:7,name:'Uranus', pos:[255,0,0], r:1.10, orbitR:255, col:[150,215,215], cs:'c<>(){}[]', spd:0.014,ph:4.2,
   desc:['URANUS','Ice giant blue','Tilted 97 degrees','Rolls on its side','27 known moons','Faint thin rings','Methane blue hue']},
];
const bodyPos=BODIES.map(b=>[...b.pos]);

const ATM=[
  null,
  null,                                   // Mercury  — no atmosphere

  {r:0.60, col:[220,190,110], str:0.90}, // Venus    planet r=0.55  (1.09x)
  {r:0.65, col:[140,205,255], str:0.75}, // Earth    planet r=0.60  (1.08x)
  {r:0.49, col:[205,110, 70], str:0.45}, // Mars     planet r=0.45  (1.09x)
  {r:2.06, col:[195,165,125], str:0.80}, // Jupiter  planet r=1.90  (1.08x)
  {r:1.62, col:[205,185,145], str:0.75}, // Saturn   planet r=1.50  (1.08x)
  {r:1.19, col:[ 80,210,210], str:0.80}, // Uranus   planet r=1.10  (1.08x)
];

const STOPS=[null,...BODIES];

// dist: camera distance from planet center at each stop.
// Camera direction is computed from the planet-sun vector so the lit side
// is always visible from the same angle regardless of orbital position.
const STOP_VIEW=[
  null,               // 0 overview
  null,               // 1 sun
  {dist:0.72, fov:72},  // 2 mercury  r=0.30
  {dist:1.24, fov:72},  // 3 venus    r=0.55
  {dist:1.34, fov:72},  // 4 earth    r=0.60
  {dist:1.10, fov:72},  // 5 mars     r=0.45
  {dist:4.60, fov:72},  // 6 jupiter  r=1.90
  {dist:7.50, fov:72},  // 7 saturn   r=1.50  rings extend to 3.30
  {dist:2.67, fov:72},  // 8 uranus   r=1.10
];

// Direction the camera sits relative to a planet: toward the sun, tilted up.
// Returns a unit vector in world space.
function stopCamDir(planetPos){
  const toSun=norm(sub(bodyPos[0],planetPos));
  return norm(add(mul(toSun,0.75),mul([0,1,0],0.55)));
}

const SS=5;
const SMAX=8*SS;

function getStopPreset(si){
  if(si===0)return{pos:[130,230,310],tgt:[130,0,0],fov:62};
  if(si===1)return{pos:[9,12,15],   tgt:[0,0,0], fov:50};
  const p=bodyPos[si-1];
  const v=STOP_VIEW[si];
  const cp=add(p,mul(stopCamDir(p),v.dist));
  return{pos:cp,tgt:[...p],fov:v.fov};
}

function getPreset(s){
  const sf=s/SS;
  const i=clamp(Math.floor(sf),0,7);
  const f=sf-i;
  const A=getStopPreset(i),B=getStopPreset(Math.min(i+1,8));
  return{pos:lv(A.pos,B.pos,f),tgt:lv(A.tgt,B.tgt,f),fov:lerp(A.fov,B.fov,f)};
}

// scroll state — spring-damper
let scrollTgt=0,scrollVel=0,scrollPos=0;
addEventListener('wheel',e=>{scrollVel+=e.deltaY*0.035;},{passive:true});

let mouseX=0,mouseY=0;
let dragActive=false,dragLastX=0,dragLastY=0,dragMoved=false;
let orbitYaw=0,orbitPitch=0,inPlanetStop=false;
cvs.addEventListener('mousemove',e=>{
  const r=cvs.getBoundingClientRect();
  mouseX=e.clientX-r.left;mouseY=e.clientY-r.top;
  if(dragActive&&inPlanetStop){
    orbitYaw-=(e.clientX-dragLastX)*0.004;
    orbitPitch=clamp(orbitPitch+(e.clientY-dragLastY)*0.003,-1.3,1.3);
    dragLastX=e.clientX;dragLastY=e.clientY;
    dragMoved=true;
  }
});
cvs.addEventListener('mousedown',e=>{if(e.button===0){dragActive=true;dragMoved=false;dragLastX=e.clientX;dragLastY=e.clientY;}});
cvs.addEventListener('mouseup',()=>{dragActive=false;});
cvs.addEventListener('mouseleave',()=>{dragActive=false;});

// ─────────────────────────────────────────────────────────────────────────────
// Camera — self-contained module. Reuse by copying this object and the
// buildCam / getRay / projectPt functions below. Tune Camera.rates to change
// feel without touching any other logic.
//
// TRANSIT mode: pos, tgt, fov all lerp toward their goals.
// STOP mode:    pos is frozen in world space (grounded, no orbital spin);
//               only tgt pans to track the body, and fov settles.
// ─────────────────────────────────────────────────────────────────────────────
const Camera={
  pos:[130,230,310],
  tgt:[130,0,0],
  fov:62,

  _gPos:[130,230,310], // transit goal — position
  _gTgt:[130,0,0],     // shared goal  — look-at point
  _gFov:62,            // shared goal  — FOV

  // Exponential-decay rates (1/s). Higher = faster/snappier.
  rates:{
    transitPos:1.0,  // position travel speed during inter-planet transit
    transitTgt:1.3,  // look-target travel speed during transit
    transitFov:0.9,  // FOV travel speed during transit
    stopPos:8.0,     // position tracking speed at a stop
    stopTgt:20.0,    // look-target tracking speed at a stop
    stopFov:2.0,     // FOV settle speed at a stop
  },

  // Set goals. Any null arg leaves that goal unchanged.
  setGoal(pos,tgt,fov){
    if(pos)this._gPos=pos;
    if(tgt)this._gTgt=tgt;
    if(fov!=null)this._gFov=fov;
  },

  // Call once per frame. mode: 'transit' | 'stop'
  // Both modes lerp — no hard snaps. Stop mode uses a fast pos rate so the
  // camera feels geostationary without any discontinuity on mode entry.
  update(dt,mode){
    if(mode==='stop'){
      const lp=clamp(1-Math.exp(-this.rates.stopPos*dt),0,1);
      const lt=clamp(1-Math.exp(-this.rates.stopTgt*dt),0,1);
      const lf=clamp(1-Math.exp(-this.rates.stopFov*dt),0,1);
      this.pos=lv(this.pos,this._gPos,lp);
      this.tgt=lv(this.tgt,this._gTgt,lt);
      this.fov=lerp(this.fov,this._gFov,lf);
    }else{
      const lp=clamp(1-Math.exp(-this.rates.transitPos*dt),0,1);
      const lt=clamp(1-Math.exp(-this.rates.transitTgt*dt),0,1);
      const lf=clamp(1-Math.exp(-this.rates.transitFov*dt),0,1);
      this.pos=lv(this.pos,this._gPos,lp);
      this.tgt=lv(this.tgt,this._gTgt,lt);
      this.fov=lerp(this.fov,this._gFov,lf);
    }
  },

  build(){return buildCam(this.pos,this.tgt,this.fov);}
};

// direct-flight nav state — records departure each time destination changes
let navToI=0,navFromScroll=0;
let navFromPos=[130,230,310],navFromTgt=[130,0,0],navFromFov=62;
let planetEntryTimer=0,prevInPlanetStop=false;

// click: fly to the clicked body or HUD stop
let lastCam=null;
const HUD_NAMES=['Overview','Sol','Mercury','Venus','Earth','Mars','Jupiter','Saturn','Uranus'];
const HUD_W=CW*14;
cvs.addEventListener('click',e=>{
  if(!lastCam||dragMoved)return;
  const rect=cvs.getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  // HUD list items
  for(let i=0;i<HUD_NAMES.length;i++){
    const hy=CH*(i+1);
    if(mx>=0&&mx<HUD_W&&my>=hy&&my<hy+CH){scrollTgt=i*SS;scrollVel=0;return;}
  }
  // planet bodies
  for(let bi=0;bi<BODIES.length;bi++){
    const proj=projectPt(bodyPos[bi],lastCam);if(!proj)continue;
    const px=(proj[0]+0.5)*CW,py=(proj[1]+0.5)*CH;
    const d2=(mx-px)**2+(my-py)**2;
    const viewDist=Math.max(0.1,len(sub(bodyPos[bi],lastCam.pos)));
    const screenR=Math.max(20,BODIES[bi].r/viewDist*(GW*CW*0.5)/lastCam.tanW);
    if(d2<screenR*screenR){
      scrollTgt=clamp(bi===0?SS:(bi+1)*SS,0,SMAX);
      scrollVel=0;
      break;
    }
  }
});

// --- camera math ---
function buildCam(pos,tgt,fovDeg){
  const fwd=norm(sub(tgt,pos));
  const wUp=Math.abs(dot(fwd,[0,1,0]))>0.98?[0,0,-1]:[0,1,0];
  const rgt=norm(cross(fwd,wUp));
  const up=cross(rgt,fwd);
  const fov=fovDeg*Math.PI/180;
  const aspect=(GW*CW)/(GH*CH);
  const tanH=Math.tan(fov/2);
  const tanW=tanH*aspect;
  return{pos,fwd,rgt,up,tanW,tanH};
}
function getRay(cx,cy,cam){
  const u=(cx+0.5)/GW*2-1,v=1-(cy+0.5)/GH*2;
  return norm(add(add(cam.fwd,mul(cam.rgt,u*cam.tanW)),mul(cam.up,v*cam.tanH)));
}
function projectPt(p,cam){
  const d=sub(p,cam.pos);
  const fz=dot(d,cam.fwd);
  if(fz<=0.001)return null;
  const fx=dot(d,cam.rgt),fy=dot(d,cam.up);
  return[Math.floor((fx/(fz*cam.tanW)*0.5+0.5)*GW),Math.floor((0.5-fy/(fz*cam.tanH)*0.5)*GH)];
}

// --- intersections ---
function raySphere(ro,rd,cen,r){
  const oc=sub(ro,cen),b=dot(oc,rd),c=len2(oc)-r*r,disc=b*b-c;
  if(disc<0)return -1;
  const sq=Math.sqrt(disc);
  let t=-b-sq;if(t<0.001)t=-b+sq;
  return t<0.001?-1:t;
}
function rayDisk(ro,rd,cenY,r1,r2,cenX,cenZ){
  if(Math.abs(rd[1])<1e-6)return -1;
  const t=(cenY-ro[1])/rd[1];if(t<0.001)return -1;
  const px=ro[0]+rd[0]*t-cenX,pz=ro[2]+rd[2]*t-cenZ,d2=px*px+pz*pz;
  return(d2>=r1*r1&&d2<=r2*r2)?t:-1;
}

// --- stars ---
const STARS=[];
for(let i=0;i<280;i++)STARS.push([fhash(i,0,77),fhash(i,0,88),fhash(i,0,99)]);

let lastT=performance.now(),globT=0;

function frame(now){
  const dt=Math.min((now-lastT)/1000,0.05);
  lastT=now;globT+=dt;

  // advance orbits
  for(let bi=1;bi<BODIES.length;bi++){
    const b=BODIES[bi],a=globT*b.spd+b.ph;
    bodyPos[bi][0]=Math.cos(a)*b.orbitR;
    bodyPos[bi][2]=Math.sin(a)*b.orbitR;
  }

  // scroll physics — spring-damper snaps scrollTgt to nearest stop
  const sn=Math.round(scrollTgt/SS)*SS;
  scrollVel+=(sn-scrollTgt)*4*dt;
  scrollVel*=Math.exp(-8.0*dt); // overdamped — settles without oscillation
  scrollTgt+=scrollVel*dt;
  scrollTgt=clamp(scrollTgt,0,SMAX);
  // scrollPos follows slowly so the camera travels the full interpolated
  // path between stops — this is what makes transit feel cinematic
  scrollPos=lerp(scrollPos,scrollTgt,clamp(dt*3.5,0,1));
  scrollPos=clamp(scrollPos,0,SMAX);

  // direct-path camera — always flies from recorded departure to current destination.
  // Works identically to the sun zoom for any jump size: one smooth lerp A→B.
  const sf=scrollPos/SS;
  const nearI=Math.round(sf); // used by HUD / text overlay below
  const destI=Math.round(scrollTgt/SS);
  if(destI!==navToI){
    navFromPos=[...Camera.pos];navFromTgt=[...Camera.tgt];navFromFov=Camera.fov;
    navFromScroll=scrollPos;navToI=destI;
    // init orbit angles from default view direction so arrival is seamless
    if(destI>=2&&destI<=8){
      const bd=stopCamDir(bodyPos[destI-1]);
      orbitYaw=Math.atan2(bd[0],bd[2]);
      orbitPitch=Math.asin(clamp(bd[1],-1,1));
    }
  }
  const dest=getStopPreset(navToI);
  const scrSpan=navToI*SS-navFromScroll;
  const rawT=Math.abs(scrSpan)<0.01?1:clamp((scrollPos-navFromScroll)/scrSpan,0,1);
  const easedT=rawT*rawT*(3-2*rawT);
  inPlanetStop=navToI>=2&&navToI<=8&&rawT>0.97;
  // During transit, keep orbit angles locked to stopCamDir so the handoff is seamless
  if(navToI>=2&&navToI<=8&&!inPlanetStop){
    const bd=stopCamDir(bodyPos[navToI-1]);
    orbitYaw=Math.atan2(bd[0],bd[2]);
    orbitPitch=Math.asin(clamp(bd[1],-1,1));
  }
  if(inPlanetStop){
    // orbit mode: position computed from spherical angles, drag rotates them
    const planet=bodyPos[navToI-1];
    const v=STOP_VIEW[navToI];
    const od=[Math.sin(orbitYaw)*Math.cos(orbitPitch),Math.sin(orbitPitch),Math.cos(orbitYaw)*Math.cos(orbitPitch)];
    const sp=add(planet,mul(od,v.dist));
    if(!prevInPlanetStop)planetEntryTimer=0;
    planetEntryTimer+=dt;
    // lerp rate ramps from transit-speed up to stop-speed over ~2s — no hard snap ever
    const entryF=Math.min(planetEntryTimer/2.0,1.0);
    const rate=lerp(Camera.rates.transitPos,Camera.rates.stopPos,entryF*entryF);
    const lp=clamp(1-Math.exp(-rate*dt),0,1);
    Camera.pos=lv(Camera.pos,sp,lp);Camera._gPos=[...sp];
    Camera.tgt=lv(Camera.tgt,planet,lp);Camera._gTgt=[...planet];
    Camera.fov=lerp(Camera.fov,v.fov,clamp(1-Math.exp(-Camera.rates.stopFov*dt),0,1));
    prevInPlanetStop=true;
  }else{
    prevInPlanetStop=false;
    Camera.setGoal(lv(navFromPos,dest.pos,easedT),lv(navFromTgt,dest.tgt,easedT),lerp(navFromFov,dest.fov,easedT));
    Camera.update(dt,rawT>0.97?'stop':'transit');
  }

  ctx.fillStyle='#000';
  ctx.fillRect(0,0,cvs.width,cvs.height);
  ctx.font=`${CH}px 'Courier New',monospace`;
  ctx.textBaseline='top';

  const cam=Camera.build();lastCam=cam;
  const camPos=Camera.pos; // local alias for rendering passes below
  const N=GW*GH;
  const grid=new Array(N).fill(null);
  const occ=new Uint8Array(N);

  // stars
  for(const[u,v,br] of STARS){
    const gx=Math.floor(u*GW),gy=Math.floor(v*GH);
    if(gx>=0&&gx<GW&&gy>=0&&gy<GH){const b=Math.floor(50+br*110);grid[gy*GW+gx]={ch:'.',r:b,g:b,b:b};}
  }

  // --- main raycast ---
  for(let cy=0;cy<GH;cy++){
    for(let cx=0;cx<GW;cx++){
      const rd=getRay(cx,cy,cam),ro=camPos;
      let minT=1e9,hitB=null,isRing=false;

      for(const body of BODIES){
        const bp=bodyPos[body.id];
        if(body.hasRing){
          const tR=rayDisk(ro,rd,bp[1],body.ringR1,body.ringR2,bp[0],bp[2]);
          if(tR>0&&tR<minT){
            const tS=raySphere(ro,rd,bp,body.r);
            if(tS<0||tR<tS){minT=tR;hitB=body;isRing=true;}
          }
        }
        const tS=raySphere(ro,rd,bp,body.r);
        if(tS>0&&tS<minT){minT=tS;hitB=body;isRing=false;}
      }

      if(!hitB)continue;
      const idx=cy*GW+cx,hbp=bodyPos[hitB.id];

      if(isRing){
        const rp=add(ro,mul(rd,minT));
        const toSun=norm(sub(bodyPos[0],rp));
        const inShadow=raySphere(rp,toSun,hbp,hitB.r)>0;
        const h=fhash(cx,cy,hitB.id+100);
        const bright=inShadow?0.05:clamp(0.55+0.35*h,0.45,0.92);
        const c=hitB.col;
        let cr=Math.floor(c[0]*bright),cg=Math.floor(c[1]*bright),cb=Math.floor(c[2]*bright);
        const bg=grid[idx];
        if(bg){const op=0.6;cr=Math.floor(bg.r*(1-op)+cr*op);cg=Math.floor(bg.g*(1-op)+cg*op);cb=Math.floor(bg.b*(1-op)+cb*op);}
        const rc=inShadow?'.,`\'':'.-~=oO*+';
        grid[idx]={ch:rc[Math.floor(h*rc.length)],r:cr,g:cg,b:cb};
        occ[idx]=2;
      }else{
        const hp=add(ro,mul(rd,minT)),nrm=norm(sub(hp,hbp));
        const toSun=norm(sub(bodyPos[0],hp));
        let br,cr,cg,cb;
        if(hitB.sun){
          const ft=globT*0.04;
          const sc1=3.5,sc2=7.0,sc3=14.0;
          const n1=sNoise(nrm[0]*sc1+ft,     nrm[1]*sc1,          nrm[2]*sc1);
          const n2=sNoise(nrm[0]*sc2,         nrm[1]*sc2+ft*1.3,   nrm[2]*sc2);
          const n3=sNoise(nrm[0]*sc3,         nrm[1]*sc3,          nrm[2]*sc3+ft*0.7);
          const ht=clamp(n1*0.55+n2*0.30+n3*0.15,0,1);
          const htBright=clamp(0.45+ht*0.55,0,1); // raise dark-spot floor
          const facing=Math.max(0,dot(nrm,norm(sub(camPos,hbp))));
          const limb=0.88+0.12*facing; // less limb darkening, brighter overall
          br=clamp(htBright*limb,0,1);
          cr=Math.floor(lerp(235,255,ht)*limb);
          cg=Math.floor(lerp(150,240,ht)*limb);
          cb=Math.floor(lerp(40,120,ht)*limb);
        }else{
          const diffuse=clamp(0.2+0.8*dot(nrm,toSun),0,1);
          if(hitB.id>=5&&hitB.id<=7){
            const ry=globT*0.006+hitB.id*1.1;
            const GSRCS=[
              [Math.cos(ry),     0,Math.sin(ry)    ],
              [Math.cos(ry+1.57),0,Math.sin(ry+1.57)],
              [Math.cos(ry+3.14),0,Math.sin(ry+3.14)],
              [Math.cos(ry+4.71),0,Math.sin(ry+4.71)],
            ];
            const lat=Math.asin(clamp(nrm[1],-1,1));
            let wave=Math.sin(lat*13-globT*0.06)*0.55;
            for(let si=0;si<GSRCS.length;si++){
              const s=GSRCS[si];
              const cosA=clamp(nrm[0]*s[0]+nrm[1]*s[1]+nrm[2]*s[2],-1,1);
              wave+=Math.sin(Math.acos(cosA)*8-globT*(0.08+si*0.015)+si*0.79)*0.11;
            }
            wave=clamp(wave,-1,1);
            br=clamp(diffuse*(0.82+0.22*wave),0,1);
          }else if(hitB.id===3){
            br=diffuse;
            const land=sNoise(nrm[0]*3.0,nrm[1]*3.0,nrm[2]*3.0)*0.50
                      +sNoise(nrm[0]*6.5,nrm[1]*6.5,nrm[2]*6.5)*0.35
                      +sNoise(nrm[0]*13, nrm[1]*13, nrm[2]*13) *0.15;
            if(land>0.54){
              const alt=clamp((land-0.54)/0.28,0,1);
              cr=Math.floor(lerp(55,110,alt)*br);
              cg=Math.floor(lerp(130,115,alt)*br);
              cb=Math.floor(lerp(40, 80,alt)*br);
            }else{
              const depth=clamp((0.54-land)/0.40,0,1);
              cr=Math.floor(lerp(70,15,depth)*br);
              cg=Math.floor(lerp(140,65,depth)*br);
              cb=Math.floor(lerp(220,170,depth)*br);
            }
          }else{
            br=diffuse;
          }
          if(hitB.id!==3){const c=hitB.col;cr=Math.floor(c[0]*br);cg=Math.floor(c[1]*br);cb=Math.floor(c[2]*br);}
        // Great Red Spot — oval storm at ~23°S, co-rotates with bands
        if(hitB.id===5){
          const grsA=globT*0.006+6.7; // phase offset places it in a visible position
          const grsLat=-0.40;         // sin(23.6°S)
          const cosLat=Math.sqrt(1-grsLat*grsLat);
          const gcx=Math.sin(grsA)*cosLat,gcz=Math.cos(grsA)*cosLat;
          const neq=Math.sqrt(nrm[0]*nrm[0]+nrm[2]*nrm[2]);
          const dLon=Math.acos(clamp((nrm[0]*gcx+nrm[2]*gcz)/Math.max(0.001,neq*cosLat),-1,1));
          const dLat=nrm[1]-grsLat;
          const gd=(dLon/0.22)**2+(dLat/0.10)**2; // ellipse: 2:1 lon:lat ratio
          if(gd<1.0){
            const t=clamp(1-gd,0,1)*0.80;
            cr=Math.floor(lerp(cr,Math.floor(210*br),t));
            cg=Math.floor(lerp(cg,Math.floor(72*br),t));
            cb=Math.floor(lerp(cb,Math.floor(38*br),t));
          }
        }
        }
        const ri=Math.floor(br*(RAMP.length-1)),base=RAMP[ri];
        const h=fhash(cx,cy,hitB.id),cs=hitB.cs;
        let ch=(br>0.07&&h<0.38)?cs[Math.floor(h/0.38*cs.length)]:base;
        if(!hitB.sun&&ch===' ')ch='.';
        grid[idx]={ch,r:cr,g:cg,b:cb};
        occ[idx]=1;
      }
    }
  }

  // --- atmosphere shell pass ---
  const atmCS='oO0()@#+*';
  for(let cy=0;cy<GH;cy++){
    for(let cx=0;cx<GW;cx++){
      const idx=cy*GW+cx;
      if(occ[idx])continue;
      const rd=getRay(cx,cy,cam),ro=camPos;
      for(let bi=1;bi<BODIES.length;bi++){
        const atm=ATM[bi];if(!atm)continue;
        const bp=bodyPos[bi];
        if(len2(sub(camPos,bp))<atm.r*atm.r)continue;
        const tA=raySphere(ro,rd,bp,atm.r);
        if(tA<0)continue;
        const hp=add(ro,mul(rd,tA));
        const nrm=norm(sub(hp,bp));
        const toSun=norm(sub(bodyPos[0],hp));
        const br=clamp(0.25+0.75*dot(nrm,toSun),0,1);
        const c=atm.col,h=fhash(cx,cy,bi*311+29);
        grid[idx]={ch:atmCS[Math.floor(h*atmCS.length)],r:Math.floor(c[0]*br),g:Math.floor(c[1]*br),b:Math.floor(c[2]*br)};
        occ[idx]=3;
        break;
      }
    }
  }

  // --- orbit ring post-pass ---
  for(const body of BODIES){
    if(!body.orbitR)continue;
    const nS=Math.max(200,Math.ceil(body.orbitR*14));
    for(let i=0;i<nS;i++){
      const a=i/nS*Math.PI*2,p=[Math.cos(a)*body.orbitR,0,Math.sin(a)*body.orbitR];
      const proj=projectPt(p,cam);if(!proj)continue;
      const[gx,gy]=proj;
      if(gx<0||gx>=GW||gy<0||gy>=GH)continue;
      const idx=gy*GW+gx;
      if(!occ[idx])grid[idx]={ch:'.',r:38,g:38,b:58};
    }
  }

  // --- text overlay ---
  const nearStop=Math.round(scrollPos/SS);
  const prox=clamp(1-Math.abs(scrollPos/SS-nearStop)*2.5,0,1);
  if(nearStop>=1&&nearStop<=8&&prox>0.02){
    const body=STOPS[nearStop],desc=body.desc;
    const maxLen=desc.reduce((m,l)=>Math.max(m,l.length),0);
    const tw=maxLen+4,th=desc.length+2;
    const tx=GW-tw-2,ty=Math.floor((GH-th)/2);
    const tik=Math.floor(globT*7);
    const GIB='!@#$%^&*=+[]{}|;:<>?/~`ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrst';
    for(let by=ty;by<ty+th;by++){
      for(let bx=tx;bx<tx+tw;bx++){
        if(bx<0||bx>=GW||by<0||by>=GH)continue;
        const isTop=by===ty,isBot=by===ty+th-1,isLeft=bx===tx,isRight=bx===tx+tw-1;
        let ch=' ';
        if(isTop&&isLeft)ch='┌';else if(isTop&&isRight)ch='┐';
        else if(isBot&&isLeft)ch='└';else if(isBot&&isRight)ch='┘';
        else if(isTop||isBot)ch='─';else if(isLeft||isRight)ch='│';
        else{
          const li=by-ty-1,ci=bx-tx-2,line=desc[li]||'';
          const tc=(ci>=0&&ci<line.length)?line[ci]:' ';
          if(tc!==' '){
            const n=fhash(bx,by,nearStop*13+7);
            ch=n<Math.pow(prox,0.4)?tc:GIB[hash32(bx,by,tik)%GIB.length];
          }
        }
        if(ch!==' '){
          const c=body.col,a=prox;
          grid[by*GW+bx]={ch,r:Math.floor(c[0]*a),g:Math.floor(c[1]*a*0.85),b:Math.floor(c[2]*a*0.85)};
        }
      }
    }
  }

  // --- render grid ---
  for(let cy=0;cy<GH;cy++){
    for(let cx=0;cx<GW;cx++){
      const cell=grid[cy*GW+cx];
      if(cell&&cell.ch!==' '){ctx.fillStyle=`rgb(${cell.r},${cell.g},${cell.b})`;ctx.fillText(cell.ch,cx*CW,cy*CH);}
    }
  }

  // --- atmosphere tint overlay ---
  for(let bi=1;bi<BODIES.length;bi++){
    const atm=ATM[bi];if(!atm)continue;
    const bp=bodyPos[bi];
    const dx=camPos[0]-bp[0],dy=camPos[1]-bp[1],dz=camPos[2]-bp[2];
    const dist2=dx*dx+dy*dy+dz*dz;
    if(dist2<atm.r*atm.r){
      const depth=1-Math.sqrt(dist2)/atm.r;
      const a=clamp(atm.str*0.48*(0.25+0.75*depth),0,0.75);
      const c=atm.col;
      ctx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${a})`;
      ctx.fillRect(0,0,cvs.width,cvs.height);
      break;
    }
  }

  // --- HUD ---
  ctx.font=`${CH}px 'Courier New',monospace`;
  let hudCursor=false;
  for(let i=0;i<HUD_NAMES.length;i++){
    const hy=CH*(i+1);
    const hovered=mouseX>=0&&mouseX<HUD_W&&mouseY>=hy&&mouseY<hy+CH;
    if(hovered)hudCursor=true;
    const d=Math.abs(scrollPos/SS-i),a=clamp(1-d*1.4,0.12,1);
    const br=hovered?1:a;
    ctx.fillStyle=hovered?`rgb(255,255,255)`:`rgb(${Math.floor(80*br)},${Math.floor(100*br)},${Math.floor(160*br)})`;
    ctx.fillText((i===nearStop&&prox>0.7?'>':' ')+' '+HUD_NAMES[i],CW,hy);
  }
  cvs.style.cursor=hudCursor?'pointer':inPlanetStop?(dragActive?'grabbing':'grab'):'default';
  if(globT<4){
    const a=clamp(1-(globT-2),0,1);
    if(a>0){ctx.fillStyle=`rgba(80,90,130,${a*0.7})`;ctx.fillText('scroll to navigate',CW,GH*CH-CH*2);}
  }

  // --- title card (overview position only) ---
  const titleA=clamp(1-scrollPos/(SS*0.7),0,1);
  if(titleA>0){
    const pad=20;
    ctx.textAlign='right';
    ctx.font=`200 52px 'Fira Sans',sans-serif`;
    ctx.fillStyle=`rgba(255,255,255,${titleA})`;
    ctx.fillText('Micah Sellers',cvs.width-pad,pad+52);
    ctx.font=`300 22px 'Fira Sans',sans-serif`;
    ctx.fillStyle=`rgba(255,255,255,${titleA})`;
    ctx.fillText('This is a placeholder until I finish my portfolio',cvs.width-pad,pad+52+62);
    ctx.fillText('scroll down to explore our Solar System',cvs.width-pad,pad+52+62+40);
    ctx.textAlign='left';
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

  // Send a request to your live Deno Deploy app
  const denoAppUrl = "https://deno-trk.deno.dev"; 
  const currentPage = window.location.pathname;
  
  fetch(`${denoAppUrl}/track?page=${encodeURIComponent(currentPage)}`, {
    mode: 'no-cors',
    keepalive: true // Ensures the request completes if the user navigates away quickly
  });
