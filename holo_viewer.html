<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hologram Wireframe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #fff;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* ───────── Embeddable host wrapper ─────────
     The whole viewer lives inside #hologram-viewer. By default it fills the viewport
     (position:fixed; inset:0). To embed it inside a larger page, override that on the
     host element — e.g. give #hologram-viewer { position: relative; width: 600px;
     height: 400px; } in your page CSS, or wrap it in any sized parent and set
     position:absolute; inset:0 on it. All the chrome (HUD, tweaks panel, overlays)
     is positioned relative to this host, not the page, so it embeds cleanly. */
  #hologram-viewer {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: 'Courier New', monospace;
  }

  #hologram-viewer #canvas-container {
    position: absolute;
    inset: 0;
  }

  #hologram-viewer canvas { display: block; width: 100%; height: 100%; }

  /* All overlay chrome is scoped to the host — not the viewport — so it embeds cleanly. */
  #hologram-viewer #scanlines,
  #hologram-viewer #vignette,
  #hologram-viewer #hud,
  #hologram-viewer #tweaks {
    position: absolute;
  }

  /* Scanline overlay */
  #scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 255, 255, 0.015) 2px,
      rgba(0, 255, 255, 0.015) 4px
    );
    pointer-events: none;
    z-index: 10;
  }

  /* Vignette */
  #vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center,
      transparent 40%,
      rgba(0, 0, 20, 0.7) 100%
    );
    pointer-events: none;
    z-index: 10;
  }

  /* Corner decorations */
  .corner {
    position: fixed;
    width: 60px;
    height: 60px;
    z-index: 20;
    pointer-events: none;
    opacity: 0.6;
  }
  .corner svg { width: 100%; height: 100%; }
  .corner.tl { top: 20px; left: 20px; }
  .corner.tr { top: 20px; right: 20px; transform: scaleX(-1); }
  .corner.bl { bottom: 20px; left: 20px; transform: scaleY(-1); }
  .corner.br { bottom: 20px; right: 20px; transform: scale(-1); }

  /* HUD labels */
  #hud {
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }

  .hud-label {
    position: absolute;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: rgba(0, 255, 255, 0.5);
    text-transform: uppercase;
  }

  .hud-label.bottom-left  { bottom: 24px; left: 24px; }
  .hud-label.bottom-right { bottom: 24px; right: 24px; text-align: right; }
  .hud-label.top-center   { top: 24px; left: 50%; transform: translateX(-50%); }

  #model-name {
    position: absolute;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 0.3em;
    color: rgba(0, 255, 255, 0.4);
    text-transform: uppercase;
  }

  /* Blink animation */
  @keyframes blink {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 0.15; }
  }
  .blink { animation: blink 2s ease-in-out infinite; }

  /* Tweaks panel */
  #tweaks {
    position: fixed;
    top: 60px;
    right: 24px;
    z-index: 40;
    width: 240px;
    background: rgba(0, 15, 25, 0.85);
    border: 1px solid rgba(0, 255, 255, 0.35);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 14px 14px 10px;
    color: rgba(0, 255, 255, 0.85);
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.1), inset 0 0 20px rgba(0, 255, 255, 0.03);
    display: none;
  }
  #tweaks.show { display: block; }
  #tweaks::before {
    content: '';
    position: absolute;
    inset: 4px;
    border: 1px solid rgba(0, 255, 255, 0.08);
    pointer-events: none;
  }
  #tweaks-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 10px;
    margin-bottom: 10px;
    border-bottom: 1px solid rgba(0, 255, 255, 0.15);
    font-size: 11px;
    letter-spacing: 0.25em;
  }
  #tweaks-close {
    cursor: pointer;
    background: none;
    border: 1px solid rgba(0, 255, 255, 0.3);
    color: rgba(0, 255, 255, 0.7);
    width: 18px;
    height: 18px;
    line-height: 14px;
    font-family: inherit;
    padding: 0;
  }
  #tweaks-close:hover { color: #fff; border-color: #00ffff; }
  .twk-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 10px;
  }
  .twk-label {
    display: flex;
    justify-content: space-between;
    color: rgba(0, 255, 255, 0.55);
    font-size: 9px;
  }
  .twk-label span:last-child { color: rgba(0, 255, 255, 0.95); }
  .twk-row input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 2px;
    background: rgba(0, 255, 255, 0.2);
    outline: none;
  }
  .twk-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px; height: 10px;
    background: #00ffff;
    border: none;
    box-shadow: 0 0 6px #00ffff;
    cursor: pointer;
  }
  .twk-row input[type=range]::-moz-range-thumb {
    width: 10px; height: 10px;
    background: #00ffff;
    border: none;
    box-shadow: 0 0 6px #00ffff;
    cursor: pointer;
  }
  .twk-color-row {
    display: flex;
    gap: 6px;
    margin-top: 2px;
  }
  .twk-swatch {
    flex: 1;
    height: 18px;
    border: 1px solid rgba(0, 255, 255, 0.2);
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .twk-swatch.active {
    border-color: #fff;
    box-shadow: 0 0 8px currentColor;
  }

  /* Pulse ring */
  @keyframes pulse-ring {
    0% { transform: translateX(-50%) scale(0.8); opacity: 0.6; }
    100% { transform: translateX(-50%) scale(1.4); opacity: 0; }
  }
  #pulse {
    position: fixed;
    bottom: 36px;
    left: 50%;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(0, 255, 255, 0.8);
    z-index: 21;
    pointer-events: none;
  }
  #pulse::after {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 1px solid rgba(0, 255, 255, 0.4);
    animation: pulse-ring 1.8s ease-out infinite;
  }
</style>
</head>
<body>

<div id="hologram-viewer">
<div id="canvas-container"></div>
<div id="scanlines"></div>
<div id="vignette"></div>

<div id="hud">
  <div class="hud-label bottom-left">θ: <span id="rot-x">0.00</span>° &nbsp; φ: <span id="rot-y">0.00</span>°</div>
</div>

<!-- Tweaks panel -->
<div id="tweaks">
  <div id="tweaks-header">
    <span>◈ Tweaks</span>
    <button id="tweaks-close">×</button>
  </div>
  <div class="twk-row">
    <div class="twk-label"><span>View Azimuth</span><span id="v-az">22°</span></div>
    <input type="range" id="r-az" min="-90" max="90" step="1" value="22">
  </div>
  <div class="twk-row">
    <div class="twk-label"><span>View Elevation</span><span id="v-el">14°</span></div>
    <input type="range" id="r-el" min="-60" max="60" step="1" value="14">
  </div>
  <div class="twk-row">
    <div class="twk-label"><span>View Distance</span><span id="v-dist">8.0</span></div>
    <input type="range" id="r-dist" min="3" max="20" step="0.1" value="8">
  </div>
  <div class="twk-row">
    <div class="twk-label"><span>Distance Dimming</span><span id="v-dim">0.18</span></div>
    <input type="range" id="r-dim" min="0" max="0.6" step="0.01" value="0.18">
  </div>
  <div class="twk-row">
    <div class="twk-label"><span>Echo Spacing</span><span id="v-sp">4.2</span></div>
    <input type="range" id="r-sp" min="2" max="8" step="0.1" value="4.2">
  </div>
  <div class="twk-row">
    <div class="twk-label"><span>Echo Radius</span><span id="v-rad">4</span></div>
    <input type="range" id="r-rad" min="1" max="6" step="1" value="4">
  </div>
  <div class="twk-row">
    <div class="twk-label"><span>Cell Falloff</span><span id="v-fo">0.55</span></div>
    <input type="range" id="r-fo" min="0.2" max="0.95" step="0.01" value="0.55">
  </div>
  <div class="twk-row">
    <div class="twk-label"><span>Fog Density</span><span id="v-fog">0.018</span></div>
    <input type="range" id="r-fog" min="0" max="0.08" step="0.001" value="0.018">
  </div>
  <div class="twk-row">
    <div class="twk-label"><span>Rotation Speed</span><span id="v-rot">0.004</span></div>
    <input type="range" id="r-rot" min="0" max="0.02" step="0.0005" value="0.004">
  </div>
  <div class="twk-row">
    <div class="twk-label"><span>Hologram Color</span><span></span></div>
    <div class="twk-color-row" id="color-swatches"></div>
  </div>
  <div class="twk-row">
    <div class="twk-label"><span>Echo Color</span><span></span></div>
    <div class="twk-color-row" id="echo-color-swatches"></div>
  </div>
  <div class="twk-row">
    <div class="twk-label"><span>Echo Darkness</span><span id="v-edk">0.55</span></div>
    <input type="range" id="r-edk" min="0" max="0.9" step="0.01" value="0.55">
  </div>
  <div class="twk-row">
    <div class="twk-label" style="flex-direction:row;align-items:center;gap:8px;cursor:pointer;">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font:inherit;color:inherit;">
        <input type="checkbox" id="t-wire" style="accent-color:#00ffff;">
        <span>Show Main Wireframe</span>
      </label>
  </div>
</div>

<!-- (drop zone removed — STL is baked in; see STL_URL constant in the script below) -->

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script>
(function() {
  // Scene setup. The viewer is scoped to #hologram-viewer (the host element), so
  // sizing comes from the host's bounding rect rather than window.innerWidth/Height.
  // This lets the same code render fullscreen OR inside a smaller window on a page.
  const host = document.getElementById('hologram-viewer');
  const container = document.getElementById('canvas-container');
  const _hostSize = () => {
    const r = host.getBoundingClientRect();
    return { w: Math.max(1, r.width), h: Math.max(1, r.height) };
  };
  const _initSize = _hostSize();
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, _initSize.w / _initSize.h, 0.01, 1000);

  // Tweakable defaults — persisted to disk via host protocol
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "cameraAzimuth": -31,
    "cameraElevation": 60,
    "cameraDistance": 4.5,
    "distanceDimming": 0,
    "echoSpacing": 5.3,
    "echoRadius": 6,
    "falloff": 0.42,
    "fogDensity": 0.022,
    "hologramColor": "#b066ff",
    "echoColor": "#1a3a4a",
    "echoDarkness": 0.02,
    "autoRotateSpeed": 0.002,
    "showWireframe": false
  }/*EDITMODE-END*/;
  const tweaks = { ...TWEAK_DEFAULTS };

  function applyCameraAngle() {
    const az = tweaks.cameraAzimuth * Math.PI / 180;
    const el = tweaks.cameraElevation * Math.PI / 180;
    const r = tweaks.cameraDistance;
    baseCamPos.set(
      Math.sin(az) * Math.cos(el) * r,
      Math.sin(el) * r,
      Math.cos(az) * Math.cos(el) * r
    );
    camera.position.copy(baseCamPos);
    camera.lookAt(0, 0, 0);
  }
  const baseCamPos = new THREE.Vector3();
  const _tmpVec3 = new THREE.Vector3();
  applyCameraAngle();

  // Exponential fog for depth — distant echoes fade into the void
  scene.fog = new THREE.FogExp2(0x000005, tweaks.fogDensity);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(_initSize.w, _initSize.h);
  renderer.setClearColor(0x000005, 1);
  container.appendChild(renderer.domElement);

  // Hologram materials
  const wireMat = new THREE.MeshBasicMaterial({
    color: 0x00ffff,
    wireframe: true,
    transparent: true,
    opacity: 0.55,
  });

  // Electric-arc shader material factory — vertices jitter via time-based noise (declared early so edgeMat can use it)
  const _arcMaterials = [];
  function makeArcMaterial(opts) {
    const m = new THREE.ShaderMaterial({
      uniforms: {
        uColor: { value: new THREE.Color(opts.color || 0x00ffff) },
        uTime: { value: 0 },
        uOpacity: { value: opts.opacity != null ? opts.opacity : 0.85 },
        uJitter: { value: opts.jitter != null ? opts.jitter : 0.02 },
        uFreq: { value: opts.freq != null ? opts.freq : 8.0 },
        uSpeed: { value: opts.speed != null ? opts.speed : 4.0 },
      },
      vertexShader: `
        uniform float uTime;
        uniform float uJitter;
        uniform float uFreq;
        uniform float uSpeed;
        float hash(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
        float noise(vec3 p){
          vec3 i = floor(p); vec3 f = fract(p);
          f = f*f*(3.0-2.0*f);
          return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),
                         mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
                     mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),
                         mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);
        }
        varying float vFlicker;
        void main() {
          vec3 p = position;
          float t = uTime * uSpeed;
          vec3 jit = vec3(
            noise(position * uFreq + vec3(t, 0.0, 0.0)) - 0.5,
            noise(position * uFreq + vec3(0.0, t * 1.13, 7.3)) - 0.5,
            noise(position * uFreq + vec3(3.7, 0.0, t * 0.91)) - 0.5
          );
          float spike = step(0.85, noise(position * 1.3 + vec3(t * 0.5)));
          p += jit * uJitter * (1.0 + spike * 4.0);
          vFlicker = 0.7 + 0.3 * noise(position * 2.0 + vec3(t * 0.7));
          float blackout = step(0.97, noise(position * 0.4 + vec3(t * 0.3)));
          vFlicker *= 1.0 - blackout * 0.85;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 uColor;
        uniform float uOpacity;
        varying float vFlicker;
        void main() {
          gl_FragColor = vec4(uColor * (1.0 + vFlicker * 0.6), uOpacity * vFlicker);
        }
      `,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
    });
    _arcMaterials.push(m);
    return m;
  }

  const edgeMat = new THREE.LineBasicMaterial({
    color: 0x00eeff,
    transparent: true,
    opacity: 0.95,
    depthWrite: false,
  });
  // Halo for main model edges (subtle bloom, not electric)
  const edgeHaloMat = new THREE.LineBasicMaterial({
    color: 0x00eeff,
    transparent: true,
    opacity: 0.25,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });

  // Depth-only mask material: writes depth but not color, so the main model's silhouette
  // occludes echoes behind it without painting any pixels itself. The visible wireframe/edges/ghost
  // still draw on top normally.
  const depthMaskMat = new THREE.MeshBasicMaterial({
    colorWrite: false,
    depthWrite: true,
    side: THREE.FrontSide,
  });

  const ghostMat = new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color(0x00ffff) },
      uOpacity: { value: 0.35 },
      uFresnelPower: { value: 2.2 },
      uCoreOpacity: { value: 0.04 },
    },
    vertexShader: `
      varying vec3 vNormal;
      varying vec3 vViewDir;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vNormal = normalize(normalMatrix * normal);
        vViewDir = normalize(-mv.xyz);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      uniform vec3 uColor;
      uniform float uOpacity;
      uniform float uFresnelPower;
      uniform float uCoreOpacity;
      varying vec3 vNormal;
      varying vec3 vViewDir;
      void main() {
        float fres = pow(1.0 - max(dot(normalize(vNormal), normalize(vViewDir)), 0.0), uFresnelPower);
        float a = uCoreOpacity + fres * uOpacity;
        gl_FragColor = vec4(uColor * (0.4 + fres * 1.2), a);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide,
  });

  // Glow: additive point light-like plane
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0x00ffff,
    transparent: true,
    opacity: 0.03,
    side: THREE.FrontSide,
    depthWrite: false,
  });

  // Group for rotation
  const group = new THREE.Group();
  scene.add(group);

  // House-of-mirrors echo group (siblings of `group`, but they mirror its rotation)
  const echoGroup = new THREE.Group();
  scene.add(echoGroup);

  // Camera will look at origin; echoes spaced out in a 3D lattice
  // Each echo flips along the axes it's mirrored across (true mirror behavior)
  // (radius / spacing / falloff now read from `tweaks` at buildEchoes time)

  // Particle field
  const particleCount = 800;
  const positions = new Float32Array(particleCount * 3);
  for (let i = 0; i < particleCount; i++) {
    // Distribute in a deep spherical shell for atmosphere depth
    const r = 8 + Math.random() * 60;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i*3+2] = r * Math.cos(phi);
  }
  const particleGeo = new THREE.BufferGeometry();
  particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const particleMat = new THREE.PointsMaterial({
    color: 0x00ffff,
    size: 0.05,
    transparent: true,
    opacity: 0.45,
    sizeAttenuation: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
  scene.add(new THREE.Points(particleGeo, particleMat));

  // Atmospheric backdrop: large inverted sphere with radial nebula gradient
  const atmoMat = new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color(0x00ffff) },
      uTime: { value: 0 },
    },
    vertexShader: `
      varying vec3 vWorldPos;
      varying vec3 vDir;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        vDir = normalize(position);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: `
      uniform vec3 uColor;
      uniform float uTime;
      varying vec3 vWorldPos;
      varying vec3 vDir;
      // hash/noise
      float hash(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
      float noise(vec3 p){
        vec3 i = floor(p); vec3 f = fract(p);
        f = f*f*(3.0-2.0*f);
        float n = mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),
                         mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
                     mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),
                         mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);
        return n;
      }
      void main() {
        // Soft cloud bands
        float n = noise(vDir * 2.5 + vec3(uTime * 0.02, 0.0, 0.0));
        n += 0.5 * noise(vDir * 5.0 - vec3(uTime * 0.03));
        n = smoothstep(0.4, 1.2, n);
        // Vertical falloff so we get a 'horizon' feel
        float horizon = 0.5 + 0.5 * vDir.y;
        float density = n * (0.4 + horizon * 0.6) * 0.35;
        vec3 col = uColor * density;
        gl_FragColor = vec4(col, 1.0);
      }
    `,
    side: THREE.BackSide,
    depthWrite: false,
    depthTest: false,
  });
  const atmoMesh = new THREE.Mesh(new THREE.SphereGeometry(80, 32, 24), atmoMat);
  atmoMesh.renderOrder = -1;
  scene.add(atmoMesh);

  // Current meshes
  let wireMesh = null, edgeMesh = null, ghostMesh = null;
  let cachedGeo = null, cachedEdgeGeo = null;
  const echoMeshes = []; // {wire, edges, ix, iy, iz, mirrorX, mirrorY, mirrorZ}

  function disposeEchoes() {
    echoMeshes.forEach(e => {
      echoGroup.remove(e.wire);
      echoGroup.remove(e.edges);
      if (e.halo) echoGroup.remove(e.halo);
      e.wire.material.dispose();
      e.edges.material.dispose();
      if (e.halo) e.halo.material.dispose();
    });
    echoMeshes.length = 0;
  }

  function clearModel() {
    [wireMesh, edgeMesh, ghostMesh].forEach(m => {
      if (m) group.remove(m);
    });
    wireMesh = edgeMesh = ghostMesh = null;
    disposeEchoes();
  }

  function buildEchoes() {
    disposeEchoes();
    if (!cachedGeo) return;

    const R = tweaks.echoRadius;
    const SP = tweaks.echoSpacing;
    const FO = tweaks.falloff;

    // Random distribution: number of echoes scales with radius cubed (volumetric density)
    const count = Math.round(8 * R * R * R);
    const maxDist = R; // in cell-units
    // Seeded PRNG so the layout is stable across rebuilds
    let seed = 1337;
    const rand = () => {
      seed = (seed * 1664525 + 1013904223) | 0;
      return ((seed >>> 0) / 4294967296);
    };

    for (let i = 0; i < count; i++) {
      // Random point inside a sphere (rejection sample for uniform distribution)
      let rx, ry, rz, r2;
      do {
        rx = (rand() * 2 - 1);
        ry = (rand() * 2 - 1);
        rz = (rand() * 2 - 1);
        r2 = rx*rx + ry*ry + rz*rz;
      } while (r2 > 1);

      const distNorm = Math.sqrt(r2); // 0..1
      const dist = distNorm * maxDist; // in cell-units, for falloff parity with old behavior

      // Skip points too close to origin (where the main model sits)
      if (distNorm < 0.15) continue;

      const opacity = Math.pow(FO, dist);
      if (opacity < 0.005) continue;

      const wireMatI = new THREE.MeshBasicMaterial({
        color: new THREE.Color(tweaks.echoColor).multiplyScalar(1 - tweaks.echoDarkness * 0.5),
        wireframe: true,
        transparent: true,
        opacity: 0.5 * opacity * (1 - tweaks.echoDarkness * 0.6),
        depthWrite: false,
      });
      const edgeMatI = makeArcMaterial({
        color: tweaks.echoColor,
        opacity: 0.75 * opacity * (1 - tweaks.echoDarkness),
        jitter: 0.09,
        freq: 5.0,
        speed: 6.0,
      });
      const haloMatI = makeArcMaterial({
        color: tweaks.echoColor,
        opacity: 0.4 * opacity * (1 - tweaks.echoDarkness),
        jitter: 0.22,
        freq: 3.0,
        speed: 4.5,
      });

      const w = new THREE.Mesh(cachedGeo, wireMatI);
      const e = new THREE.LineSegments(cachedEdgeGeo, edgeMatI);
      const halo = new THREE.LineSegments(cachedEdgeGeo, haloMatI);

      // Position in world space, scaled by spacing
      const px = rx * R * SP;
      const py = ry * R * SP;
      const pz = rz * R * SP;
      // Random rotation phase per-echo so they don't all spin in lockstep
      const phaseOffset = rand() * Math.PI * 2;
      // Random initial orientation per echo
      const initRotX = rand() * Math.PI * 2;
      const initRotY = rand() * Math.PI * 2;
      const initRotZ = rand() * Math.PI * 2;

      [w, e, halo].forEach(m => {
        m.position.set(px, py, pz);
        m.rotation.set(initRotX, initRotY, initRotZ);
        echoGroup.add(m);
      });

      echoMeshes.push({ wire: w, edges: e, halo, ix: rx, iy: ry, iz: rz, phaseOffset, baseOpacity: opacity, initRotX, initRotY, initRotZ });
    }
  }

  function loadGeometry(geo) {
    clearModel();
    geo.center();
    geo.computeBoundingSphere();
    // Normalize by bounding-sphere radius so every model appears at the same on-screen size,
    // independent of axis-aligned aspect ratio or stray outlier vertices.
    const radius = geo.boundingSphere.radius || 1;
    const scale = 1.4 / radius;
    geo.scale(scale, scale, scale);
    geo.computeBoundingSphere();
    geo.computeVertexNormals();

    cachedGeo = geo;
    cachedEdgeGeo = new THREE.EdgesGeometry(geo, 15);

    // Depth-only mask: invisible mesh that writes the model's silhouette into the depth buffer
    // before echoes draw, so background echoes get occluded by the main model.
    const maskMesh = new THREE.Mesh(geo, depthMaskMat);
    maskMesh.renderOrder = -1;
    group.add(maskMesh);

    // Center model (real, foreground)
    wireMesh = new THREE.Mesh(geo, wireMat);
    wireMesh.visible = tweaks.showWireframe;
    group.add(wireMesh);

    ghostMesh = new THREE.Mesh(geo, ghostMat);
    group.add(ghostMesh);

    edgeMesh = new THREE.LineSegments(cachedEdgeGeo, edgeMat);
    group.add(edgeMesh);
    // Main model halo
    const mainHalo = new THREE.LineSegments(cachedEdgeGeo, edgeHaloMat);
    group.add(mainHalo);

    group.position.y = 0;

    buildEchoes();
  }

  // Demo geometry: procedural scoop-like shape
  function buildDemoShape() {
    const geo = new THREE.BufferGeometry();
    // Use lathe geometry as a scoop silhouette
    const points = [];
    for (let i = 0; i <= 20; i++) {
      const t = i / 20;
      const x = t * 1.2;
      const y = Math.pow(t, 0.6) * 0.8 - 0.4;
      points.push(new THREE.Vector2(x, y));
    }
    const lathe = new THREE.LatheGeometry(points, 32);
    loadGeometry(lathe);
  }

  // ───────────── Baked-in STL ─────────────
  // The model is loaded automatically from this URL on page load.
  // To swap in a different model, change STL_URL below to point at your STL file.
  // It can be a relative path ("models/myPart.stl"), a same-origin URL, or any
  // URL that serves the STL with permissive CORS headers.
  const STL_URL = 'scoopPart.stl';

  const loader = new THREE.STLLoader();

  // Fetch + parse the baked-in STL on startup.
  loader.load(
    STL_URL,
    (geo) => { loadGeometry(geo); },
    undefined,
    (err) => {
      console.error('Failed to load STL from', STL_URL, err);
      // Fallback so the scene still has something to render if the STL is missing.
      buildDemoShape();
    }
  );

  // (Drag-and-drop upload removed — the STL is baked in via STL_URL above.)

  // Mouse interaction
  let isDragging = false, lastX = 0, lastY = 0;
  let autoRotate = false;
  let manualRotX = 0, manualRotY = 0;
  let velRotX = 0, velRotY = 0;  // angular velocity for inertia

  renderer.domElement.addEventListener('mousedown', e => {
    isDragging = true; autoRotate = false;
    velRotX = 0; velRotY = 0;
    lastX = e.clientX; lastY = e.clientY;
  });
  renderer.domElement.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    velRotY = dx * 0.005;
    velRotX = dy * 0.005;
    manualRotY += velRotY;
    manualRotX += velRotX;
    lastX = e.clientX; lastY = e.clientY;
  });
  renderer.domElement.addEventListener('mouseup', () => {
    isDragging = false;
  });

  // Touch
  let lastTX = 0, lastTY = 0;
  renderer.domElement.addEventListener('touchstart', e => {
    autoRotate = false;
    lastTX = e.touches[0].clientX; lastTY = e.touches[0].clientY;
  });
  renderer.domElement.addEventListener('touchmove', e => {
    const dx = e.touches[0].clientX - lastTX, dy = e.touches[0].clientY - lastTY;
    velRotY = dx * 0.005;
    velRotX = dy * 0.005;
    manualRotY += velRotY;
    manualRotX += velRotX;
    lastTX = e.touches[0].clientX; lastTY = e.touches[0].clientY;
  });
  renderer.domElement.addEventListener('touchend', () => {
  });

  // Scroll wheel intentionally not handled — let page scroll naturally

  // HUD
  const rotXEl = document.getElementById('rot-x');
  const rotYEl = document.getElementById('rot-y');

  // Animation
  let time = 0;
  let _frameCount = 0;
  function animate() {
    requestAnimationFrame(animate);
    time += 0.005;
    _frameCount++;
    if (atmoMat) atmoMat.uniforms.uTime.value = time;
    // Drive electric-arc shaders
    const arcN = _arcMaterials.length;
    for (let i = 0; i < arcN; i++) _arcMaterials[i].uniforms.uTime.value = time;

    if (autoRotate) {
      manualRotY += tweaks.autoRotateSpeed;
    }

    // Inertia: when not dragging, decay velocity and keep rotating
    if (!isDragging) {
      manualRotX += velRotX;
      manualRotY += velRotY;
      velRotX *= 0.94;
      velRotY *= 0.94;
      if (Math.abs(velRotX) < 0.00005) velRotX = 0;
      if (Math.abs(velRotY) < 0.00005) velRotY = 0;
    }


    group.rotation.x = manualRotX;
    group.rotation.y = manualRotY;

    // Echoes rotate independently of the user-controlled main model — each spins on its own axis,
    // but the lattice as a whole stays put (no group-level yaw).
    // Combined hot loop: rotation + per-echo opacity (dim by world-space distance from camera).
    const camPos = camera.position;
    const dimK = tweaks.distanceDimming;
    const _tmp = _tmpVec3;
    const t06 = time * 0.06;
    const t08 = time * 0.08;
    const t15 = time * 1.5;
    for (let i = 0; i < echoMeshes.length; i++) {
      const e = echoMeshes[i];
      // Spin
      const wRot = e.wire.rotation;
      wRot.x = e.initRotX + t06;
      wRot.y = e.initRotY + t08;
      wRot.z = e.initRotZ;
      e.edges.rotation.copy(wRot);
      if (e.halo) e.halo.rotation.copy(wRot);

      // Opacity (skip distance math when dimming is off — saves matrix work)
      const phase = (e.ix + e.iy + e.iz) * 0.7;
      const shimmer = 0.85 + Math.sin(t15 + phase) * 0.15;
      let distDim = 1;
      if (dimK > 0) {
        e.wire.getWorldPosition(_tmp);
        distDim = Math.exp(-dimK * _tmp.distanceTo(camPos));
      }
      const finalDim = e.baseOpacity * shimmer * distDim;
      e.wire.material.opacity = 0.5 * finalDim;
      e.edges.material.opacity = 0.45 * finalDim;
      if (e.halo) e.halo.material.opacity = 0.18 * finalDim;
    }

    // Pulsing opacity on wireframe
    if (wireMesh) {
      wireMesh.material.opacity = 0.45 + Math.sin(time * 2) * 0.08;
    }
    if (edgeMesh) {
      edgeMesh.material.opacity = 0.75 + Math.sin(time * 2.5 + 1) * 0.15;
    }

    // Particles drift — direct typed-array loop over Y components
    const pArr = particleGeo.attributes.position.array;
    for (let i = 1; i < pArr.length; i += 3) {
      let y = pArr[i] + 0.001;
      if (y > 5) y = -5;
      pArr[i] = y;
    }
    particleGeo.attributes.position.needsUpdate = true;

    // Update HUD — spherical coordinates of the rotated model's forward vector
    // (forward = group.rotation applied to (0,0,1)). Azimuth θ = horizontal angle around Y,
    // polar φ = angle from the +Y up-axis, radius ρ stays at 1 since it's a pure rotation.
    const cx = Math.cos(manualRotX), sx = Math.sin(manualRotX);
    const cy = Math.cos(manualRotY), sy = Math.sin(manualRotY);
    // R_y * R_x * (0,0,1) = (sy*cx, -sx, cy*cx)
    const fx = sy * cx, fy = -sx, fz = cy * cx;
    const rho = 1; // unit forward vector
    const theta = Math.atan2(fx, fz) * 180 / Math.PI;       // azimuth in deg, [-180,180]
    const phi = Math.acos(Math.max(-1, Math.min(1, fy))) * 180 / Math.PI; // polar in deg, [0,180]
    rotXEl.textContent = theta.toFixed(2);
    rotYEl.textContent = phi.toFixed(2);

    renderer.render(scene, camera);
  }

  animate();

  // Resize: react to host element size changes (works for both fullscreen and
  // embedded usage). Uses ResizeObserver where available, falls back to window resize.
  function _applyResize() {
    const { w, h } = _hostSize();
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(_applyResize).observe(host);
  } else {
    window.addEventListener('resize', _applyResize);
  }

  // Post-process glow via CSS filter on canvas
  renderer.domElement.style.filter = 'brightness(1.1)';

  // ───────────── Tweaks panel + host protocol ─────────────
  const panel = document.getElementById('tweaks');
  const closeBtn = document.getElementById('tweaks-close');

  // Listen FIRST, then announce availability
  window.addEventListener('message', (ev) => {
    const d = ev.data || {};
    if (d.type === '__activate_edit_mode') panel.classList.add('show');
    else if (d.type === '__deactivate_edit_mode') panel.classList.remove('show');
  });
  window.parent.postMessage({ type: '__edit_mode_available' }, '*');

  closeBtn.addEventListener('click', () => {
    panel.classList.remove('show');
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  });

  function persist(key, value) {
    tweaks[key] = value;
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: value } }, '*');
  }

  function bindSlider(inputId, displayId, key, decimals, suffix) {
    const inp = document.getElementById(inputId);
    const disp = document.getElementById(displayId);
    inp.value = tweaks[key];
    disp.textContent = (decimals != null ? Number(tweaks[key]).toFixed(decimals) : tweaks[key]) + (suffix || '');
    inp.addEventListener('input', () => {
      const v = parseFloat(inp.value);
      disp.textContent = (decimals != null ? v.toFixed(decimals) : v) + (suffix || '');
      persist(key, v);
      onTweakChange(key);
    });
  }

  function onTweakChange(key) {
    if (key === 'cameraAzimuth' || key === 'cameraElevation' || key === 'cameraDistance') {
      applyCameraAngle();
    } else if (key === 'fogDensity') {
      scene.fog.density = tweaks.fogDensity;
    } else if (key === 'echoSpacing' || key === 'echoRadius' || key === 'falloff') {
      buildEchoes();
    } else if (key === 'echoColor' || key === 'echoDarkness') {
      buildEchoes();
    } else if (key === 'showWireframe') {
      if (wireMesh) wireMesh.visible = tweaks.showWireframe;
    } else if (key === 'hologramColor') {
      const col = new THREE.Color(tweaks.hologramColor);
      wireMat.color.copy(col);
      edgeMat.color.copy(col);
      edgeHaloMat.color.copy(col);
      ghostMat.uniforms.uColor.value.copy(col);
      // Don't recolor echoes — they have their own color now
      particleMat.color.copy(col);
      atmoMat.uniforms.uColor.value.copy(col);
    }
  }

  bindSlider('r-az', 'v-az', 'cameraAzimuth', 0, '°');
  bindSlider('r-el', 'v-el', 'cameraElevation', 0, '°');
  bindSlider('r-dist', 'v-dist', 'cameraDistance', 1, '');
  bindSlider('r-dim', 'v-dim', 'distanceDimming', 2, '');
  bindSlider('r-sp', 'v-sp', 'echoSpacing', 1, '');
  bindSlider('r-rad', 'v-rad', 'echoRadius', 0, '');
  bindSlider('r-fo', 'v-fo', 'falloff', 2, '');
  bindSlider('r-fog', 'v-fog', 'fogDensity', 3, '');
  bindSlider('r-rot', 'v-rot', 'autoRotateSpeed', 4, '');

  bindSlider('r-edk', 'v-edk', 'echoDarkness', 2, '');

  // Wireframe toggle
  const wireToggle = document.getElementById('t-wire');
  if (wireToggle) {
    wireToggle.checked = !!tweaks.showWireframe;
    wireToggle.addEventListener('change', () => {
      persist('showWireframe', wireToggle.checked);
      onTweakChange('showWireframe');
    });
  }

  // Echo color swatches
  const ECHO_COLORS = ['#3a1a66', '#0a1a40', '#1a3a4a', '#3a1a1a', '#1a3a1a'];
  const echoSwatchRow = document.getElementById('echo-color-swatches');
  ECHO_COLORS.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'twk-swatch';
    sw.style.background = c;
    sw.style.color = c;
    if (c === tweaks.echoColor) sw.classList.add('active');
    sw.addEventListener('click', () => {
      [...echoSwatchRow.children].forEach(x => x.classList.remove('active'));
      sw.classList.add('active');
      persist('echoColor', c);
      onTweakChange('echoColor');
    });
    echoSwatchRow.appendChild(sw);
  });

  // Color swatches
  const COLORS = ['#00ffff', '#ff3366', '#39ff14', '#ffaa00', '#b066ff'];
  const swatchRow = document.getElementById('color-swatches');
  COLORS.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'twk-swatch';
    sw.style.background = c;
    sw.style.color = c;
    if (c === tweaks.hologramColor) sw.classList.add('active');
    sw.addEventListener('click', () => {
      [...swatchRow.children].forEach(x => x.classList.remove('active'));
      sw.classList.add('active');
      persist('hologramColor', c);
      onTweakChange('hologramColor');
    });
    swatchRow.appendChild(sw);
  });
  // Apply initial color
  onTweakChange('hologramColor');

})();
</script>
</div> <!-- /#hologram-viewer -->
</body>
